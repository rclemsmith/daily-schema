<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Schema">
<meta name="mobile-web-app-capable" content="yes">
<title>Daily Schema</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0C1118;
    --panel: #131A24;
    --panel-2: #182131;
    --line: #26313F;
    --text: #E7ECF1;
    --text-dim: #94A3B3;
    --accent: #4FD8C4;
    --accent-dim: #2B7A6E;
    --amber: #E8A94A;
    --bad: #E0705B;
    --good: #5FBF8B;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --sans: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #F3F1EC;
      --panel: #FFFFFF;
      --panel-2: #FBFAF7;
      --line: #DAD5CA;
      --text: #1B2027;
      --text-dim: #5C6470;
      --accent: #1B7F70;
      --accent-dim: #BFE7DF;
      --amber: #B4761F;
      --bad: #B23F2B;
      --good: #24805A;
    }
  }
  :root[data-theme="light"] {
    --ink: #F3F1EC;
    --panel: #FFFFFF;
    --panel-2: #FBFAF7;
    --line: #DAD5CA;
    --text: #1B2027;
    --text-dim: #5C6470;
    --accent: #1B7F70;
    --accent-dim: #BFE7DF;
    --amber: #B4761F;
    --bad: #B23F2B;
    --good: #24805A;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  .app { max-width: 560px; margin: 0 auto; padding: 20px 18px 64px; }

  /* header: table strip */
  header.topbar {
    position: sticky; top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--ink);
    padding: 14px 18px calc(14px + env(safe-area-inset-top, 0px));
    margin: 0 0 4px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header.topbar .brand {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em;
    color: var(--text-dim);
  }
  header.topbar .brand b { color: var(--accent); font-weight: 600; }
  header.topbar .theme-toggle {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    background: none; border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }

  .schema-row {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    margin: 18px 0 6px;
  }
  .schema-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .schema-row .path { color: var(--accent); }

  .table-title {
    font-family: var(--mono);
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--text);
  }
  .table-tagline {
    font-size: 16px; color: var(--text-dim); line-height: 1.5;
    margin: 0 0 22px; max-width: 60ch;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    color: var(--accent); margin: 0 0 12px; letter-spacing: 0.01em;
  }
  .card p { line-height: 1.65; font-size: 15.5px; margin: 0 0 12px; }
  .card p:last-child { margin-bottom: 0; }

  .col-list { list-style: none; margin: 0; padding: 0; }
  .col-list li {
    display: grid; grid-template-columns: 20px 1fr; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.5;
  }
  .col-list li:first-child { border-top: none; }
  .col-list .idx { font-family: var(--mono); color: var(--text-dim); font-size: 12px; padding-top: 2px; }

  .why-now {
    border-left: 2px solid var(--amber);
    padding-left: 14px;
  }
  .why-now h2 { color: var(--amber); }

  /* quiz */
  .quiz-q { font-size: 15.5px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
  .quiz-opt {
    display: block; width: 100%; text-align: left;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 11px 13px; margin-bottom: 8px; font-size: 14.5px;
    font-family: var(--sans); cursor: pointer; line-height: 1.4;
  }
  .quiz-opt:active { transform: scale(0.99); }
  .quiz-opt[data-state="correct"] { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel-2)); }
  .quiz-opt[data-state="wrong"] { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--panel-2)); }
  .quiz-opt[disabled] { cursor: default; }
  .quiz-explain {
    font-size: 14px; color: var(--text-dim); line-height: 1.55;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    display: none;
  }
  .quiz-explain.show { display: block; }
  .quiz-progress {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-bottom: 14px; letter-spacing: 0.03em;
  }

  /* AI briefing */
  .ai-card h2 { display: flex; align-items: center; justify-content: space-between; }
  .ai-btn {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: var(--accent); border: none; border-radius: 6px;
    padding: 9px 14px; cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ai-btn[disabled] { opacity: 0.55; cursor: default; }
  .ai-body { font-size: 15px; line-height: 1.65; white-space: pre-wrap; }
  .ai-placeholder { color: var(--text-dim); font-size: 14px; line-height: 1.6; }
  .ai-hidden { display: none !important; }
  .spin {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(12,17,24,0.3); border-top-color: var(--ink);
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer.note {
    text-align: center; font-family: var(--mono); font-size: 11px;
    color: var(--text-dim); margin-top: 8px; line-height: 1.6;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">daily_schema<b>.db</b></div>
  <button class="theme-toggle" id="themeToggle">theme</button>
</header>

<div class="app">
  <div class="schema-row"><span class="dot"></span><span id="dateLabel"></span> · <span class="path" id="categoryLabel"></span></div>
  <h1 class="table-title" id="titleLabel"></h1>
  <p class="table-tagline" id="taglineLabel"></p>

  <div class="card">
    <h2>lesson</h2>
    <div id="lessonBody"></div>
  </div>

  <div class="card">
    <h2>key columns</h2>
    <ul class="col-list" id="keyPoints"></ul>
  </div>

  <div class="card why-now">
    <h2>why it matters now</h2>
    <p id="whyNow"></p>
  </div>

  <div class="card ai-card">
    <h2>live briefing <button class="ai-btn" id="aiBtn">ask claude ▸</button></h2>
    <p class="ai-placeholder" id="aiPlaceholder">Get a fresh, up-to-date take on today's topic and what's changed recently in the surrounding tooling.</p>
    <div class="ai-body ai-hidden" id="aiBody"></div>
  </div>

  <div class="card" id="quizCard">
    <h2>pop query — test yourself</h2>
    <div class="quiz-progress" id="quizProgress"></div>
    <div id="quizArea"></div>
  </div>

  <footer class="note">rotates daily · nothing is saved between visits</footer>
</div>

<script>
/* ---------------- Content library ---------------- */
const LIB = [
{
  category: "warehousing.core",
  title: "star_schema",
  tagline: "The dimensional modeling pattern behind almost every warehouse you've ever queried.",
  lesson: [
    "A star schema organizes a warehouse around one or more fact tables (the events: orders, clicks, shipments) surrounded by dimension tables (the who/what/where: customers, products, dates). The fact table holds foreign keys to each dimension plus numeric measures — think of it as the wide, skinny table at the center of a wheel.",
    "It's called 'star' because if you draw it out, the fact table sits in the middle with dimensions radiating outward like points on a star, each joined directly — never dimension-to-dimension. That single-hop join pattern is exactly what makes star schemas fast for the kind of aggregate-heavy, filter-by-attribute queries BI tools generate."
  ],
  keyPoints: [
    "Fact table = grain + measures + foreign keys (e.g. one row per order line)",
    "Dimension tables are denormalized on purpose — wide and flat, not 3NF",
    "Snowflake schema = same idea but dimensions are further normalized, trading storage for join complexity",
    "Grain matters most: define 'one row = what' before adding a single column"
  ],
  whyNow: "Even lakehouse-native tools (dbt, Databricks' medallion architecture) still converge on star-schema-shaped 'gold' layers, because BI semantic layers and columnar engines are both optimized for this exact join topology.",
  quiz: [
    { q: "In a star schema, dimension tables typically join to:", opts: ["Other dimension tables directly", "The fact table only", "A separate lookup service", "Nothing — they're standalone"], correct: 1, explain: "Star schemas avoid dimension-to-dimension joins on purpose — every dimension hangs off the fact table in one hop, which keeps BI queries fast and predictable." },
    { q: "The 'grain' of a fact table refers to:", opts: ["How compressed the data is", "What one row represents", "The number of dimensions attached", "The refresh frequency"], correct: 1, explain: "Grain is the single most important design decision in a fact table — e.g. 'one row per order line item' — everything else follows from it." }
  ]
},
{
  category: "warehousing.storage",
  title: "columnar_storage",
  tagline: "Why Redshift, Synapse, Snowflake and BigQuery all store data by column, not by row.",
  lesson: [
    "Row-oriented databases (Postgres, MySQL in default mode) store all columns of a row together on disk — great for fetching one full record fast. Analytical warehouses instead store each column contiguously, because analytical queries usually touch a handful of columns across millions of rows, not all columns of a single row.",
    "Columnar layout pays off twice: I/O drops because you only read the columns the query actually references, and compression improves dramatically because values within one column are far more similar to each other than values across a row (e.g. a 'country' column compresses beautifully; a row mixing strings, dates and floats doesn't)."
  ],
  keyPoints: [
    "Columnar = read less data per query (column pruning)",
    "Compression ratios are typically far better per-column than per-row",
    "Trade-off: single-row lookups/updates get relatively more expensive",
    "Redshift, Synapse dedicated pools, Snowflake, BigQuery, ClickHouse all columnar at the core"
  ],
  whyNow: "The same principle now underpins open table formats like Apache Iceberg and Delta Lake, which store columnar Parquet files but add a transactional metadata layer — letting a lakehouse get warehouse-grade performance without a proprietary storage engine.",
  quiz: [
    { q: "Columnar storage speeds up analytical queries mainly because:", opts: ["It uses faster disks", "Queries can skip reading unused columns", "It removes the need for indexes entirely", "Rows are stored in random order"], correct: 1, explain: "Column pruning — reading only the columns a query touches — is the core win; compression benefits stack on top of that." },
    { q: "Columnar storage tends to be relatively worse at:", opts: ["Aggregating millions of rows", "Compressing repetitive values", "Fetching/updating one full row at a time", "Scanning a single column"], correct: 2, explain: "Because a row's values are scattered across separate column files, reconstructing or updating one full row costs more than in a row store." }
  ]
},
{
  category: "modeling.transform",
  title: "etl_vs_elt",
  tagline: "Where the 'transform' step happens changed the entire modern data stack.",
  lesson: [
    "ETL (Extract, Transform, Load) transforms data in a separate processing layer before it ever lands in the warehouse — historically necessary because warehouses were expensive and slow at general-purpose compute.",
    "ELT (Extract, Load, Transform) loads raw data into the warehouse first, then transforms it in-place using the warehouse's own compute — usually via SQL, often orchestrated by a tool like dbt. This flipped order became dominant once cloud warehouses made storage cheap and elastic compute abundant."
  ],
  keyPoints: [
    "ETL: transform happens outside the warehouse, before load",
    "ELT: raw data lands first, transform happens inside the warehouse",
    "dbt is the tool most associated with the 'T' in modern ELT",
    "ELT keeps raw data around, which makes re-processing and debugging easier"
  ],
  whyNow: "The rise of dbt, cheap columnar cloud warehouses, and now lakehouse table formats has made ELT the default for new pipelines — ETL tools like Informatica/SSIS remain common in legacy or highly regulated environments.",
  quiz: [
    { q: "The main enabler that made ELT practical was:", opts: ["Faster internet speeds", "Cheap, elastic warehouse compute/storage", "The invention of SQL", "Smaller data volumes"], correct: 1, explain: "Once cloud warehouses decoupled storage from compute and made both cheap, it became practical to load raw data first and transform it in place." },
    { q: "A key operational benefit of ELT over ETL is:", opts: ["No orchestration is needed", "Raw source data stays available for reprocessing", "Transform logic runs faster by definition", "It requires no SQL knowledge"], correct: 1, explain: "Because raw data is loaded before transformation, you can always re-derive downstream models without re-extracting from source." }
  ]
},
{
  category: "lakehouse.formats",
  title: "iceberg_delta",
  tagline: "Open table formats: the layer that turned a pile of files into something a warehouse would recognize.",
  lesson: [
    "A data lake is just files (usually Parquet) in object storage — no transactions, no schema enforcement, no reliable way to know which files make up 'the current table'. Open table formats like Apache Iceberg, Delta Lake and Apache Hudi add a metadata layer on top: snapshots, schema evolution, ACID transactions, and time travel — all while the actual data stays in plain Parquet files you own.",
    "This is the technical backbone of the 'lakehouse' pitch: warehouse-like guarantees (consistency, updates, deletes) without locking your data inside a proprietary storage engine — any compatible engine (Spark, Trino, Snowflake, Redshift Spectrum, DuckDB) can read the same table."
  ],
  keyPoints: [
    "Table format ≠ file format — Parquet is the file format, Iceberg/Delta are the table layer above it",
    "Enables ACID transactions and schema evolution directly on object storage",
    "Time travel: query a table as it existed at a prior snapshot",
    "Vendor-neutral: multiple engines can read/write the same underlying tables"
  ],
  whyNow: "This is the single biggest architectural shift in DWH right now — Snowflake, Databricks, Redshift, Synapse, and BigQuery have all added native Iceberg support in the last two years, effectively conceding that the table format layer is becoming a shared, open standard.",
  quiz: [
    { q: "Apache Iceberg is best described as:", opts: ["A file compression codec", "A metadata layer that adds transactions/schema evolution to files in object storage", "A replacement for SQL", "A proprietary warehouse engine"], correct: 1, explain: "Iceberg doesn't replace Parquet — it sits above it, tracking snapshots and schema so multiple engines can safely read/write the same table." },
    { q: "'Time travel' in Iceberg/Delta refers to:", opts: ["Predicting future query load", "Querying a table as of a past snapshot", "Automatic data archival", "Scheduling future transforms"], correct: 1, explain: "Every write creates a new snapshot; time travel lets you query (or roll back to) an earlier one." }
  ]
},
{
  category: "warehousing.perf",
  title: "materialized_views",
  tagline: "Precomputed query results that keep themselves (mostly) up to date.",
  lesson: [
    "A regular view is just a saved query — it re-runs against base tables every time you select from it. A materialized view actually stores the result set, so reads are fast, but it needs a refresh strategy to stay current as base tables change.",
    "Most modern warehouses (Redshift, Synapse, Snowflake, BigQuery) now support automatic incremental refresh — only the changed rows are recomputed, not the whole view — and query rewriting, where the optimizer silently substitutes a matching materialized view for parts of a query, even if you never referenced it directly."
  ],
  keyPoints: [
    "View = saved query, recomputed on every read",
    "Materialized view = stored result, needs a refresh policy",
    "Incremental refresh updates only changed rows, not a full rebuild",
    "Automatic query rewrite can use a materialized view without you querying it explicitly"
  ],
  whyNow: "As warehouses compete on price-performance, automatic incremental materialized views have become a major differentiator — Redshift's AutoMV and Snowflake's dynamic tables both push this toward being a 'set it and forget it' optimization rather than a manual DBA task.",
  quiz: [
    { q: "The main advantage of a materialized view over a regular view is:", opts: ["It uses less storage", "Reads are faster because results are precomputed", "It never needs refreshing", "It only works on small tables"], correct: 1, explain: "Materialized views trade storage and refresh cost for much faster reads, since the result set is already computed." },
    { q: "Incremental refresh means:", opts: ["The whole view is rebuilt on a timer", "Only changed rows are recomputed", "The view is deleted and recreated", "Refresh happens manually every time"], correct: 1, explain: "Incremental refresh processes just the delta since the last refresh, which is far cheaper than a full rebuild on large fact tables." }
  ]
},
{
  category: "movement.cdc",
  title: "change_data_capture",
  tagline: "How modern pipelines stream row-level changes instead of re-scanning entire tables.",
  lesson: [
    "Change Data Capture (CDC) identifies and streams individual row-level changes (inserts, updates, deletes) from a source system as they happen, instead of periodically re-extracting the whole table. The most common approach reads the source database's transaction log (e.g. Postgres WAL, MySQL binlog) so capture has near-zero impact on the source system.",
    "CDC is what makes near-real-time warehousing practical: tools like Debezium, Fivetran, and native connectors in Synapse/Redshift capture these log events and stream them into the warehouse or a message bus like Kafka, where they can be applied incrementally."
  ],
  keyPoints: [
    "Log-based CDC reads the transaction log — lowest overhead on the source",
    "Alternative: query-based CDC (polling for changed timestamps) — simpler but heavier and lossier",
    "CDC turns batch ETL into continuous, low-latency data movement",
    "Debezium is the most common open-source log-based CDC engine"
  ],
  whyNow: "CDC is the connective tissue between OLTP databases and the streaming/lakehouse world — it's the standard pattern for feeding Kafka topics, Iceberg tables, and real-time dashboards from operational databases without hammering production systems with full scans.",
  quiz: [
    { q: "Log-based CDC reads changes from:", opts: ["A nightly full table export", "The database's transaction log", "Application-level audit tables only", "A manual change request form"], correct: 1, explain: "Reading the transaction log (WAL, binlog, etc.) lets CDC capture every change with minimal load on the source database." },
    { q: "Compared to query-based polling, log-based CDC is generally:", opts: ["Slower and heavier on the source", "Lower overhead and more complete", "Only usable for deletes", "Unrelated to streaming pipelines"], correct: 1, explain: "Polling for changed rows adds load and can miss intermediate changes or deletes; log-based CDC captures every change with far less source impact." }
  ]
},
{
  category: "querying.oltp_olap",
  title: "oltp_vs_olap",
  tagline: "The split that decides whether you reach for Postgres or Redshift.",
  lesson: [
    "OLTP (Online Transaction Processing) systems — Postgres, MySQL, Aurora — are optimized for many small, fast, concurrent read/write transactions: placing an order, updating a balance. Schemas are normalized to avoid duplication and keep writes cheap and consistent.",
    "OLAP (Online Analytical Processing) systems — Redshift, Synapse, Snowflake, BigQuery — are optimized for the opposite pattern: fewer, larger queries that scan and aggregate huge volumes of historical data. Schemas are denormalized (star schema) and storage is columnar, because that's what makes big scans fast, at the cost of making single-row writes relatively expensive."
  ],
  keyPoints: [
    "OLTP: row-oriented, normalized, optimized for many small transactions",
    "OLAP: columnar, denormalized, optimized for large aggregate scans",
    "Data usually flows OLTP → (CDC/ELT) → OLAP, rarely the other direction",
    "HTAP systems attempt to blur this line but usually trade off one side"
  ],
  whyNow: "HTAP (Hybrid Transactional/Analytical Processing) engines and Postgres-compatible analytical extensions are chipping at this boundary, but the fundamental storage trade-off — row vs columnar — still makes a dedicated OLAP layer the default for serious analytics.",
  quiz: [
    { q: "OLTP systems are typically optimized for:", opts: ["Scanning billions of historical rows", "Many small, fast concurrent transactions", "Running once-a-day batch reports", "Storing data in columnar format"], correct: 1, explain: "OLTP is built for the operational workload — lots of small, concurrent reads and writes with strong consistency." },
    { q: "The typical direction data flows between the two is:", opts: ["OLAP → OLTP", "OLTP → OLAP", "They never exchange data", "Randomly, depending on load"], correct: 1, explain: "Operational (OLTP) data is extracted and loaded into the analytical (OLAP) warehouse — the reverse is rare and usually a red flag." }
  ]
},
{
  category: "querying.optimization",
  title: "distribution_and_sortkeys",
  tagline: "Why the same query can be instant or brutal depending on how you laid the table out.",
  lesson: [
    "In an MPP (massively parallel processing) warehouse like Redshift or Synapse dedicated pools, a table's rows are physically distributed across multiple compute nodes. How you choose that distribution key determines whether a join happens locally on each node or requires shuffling data across the network — the single biggest lever for query performance at scale.",
    "Sort keys (or clustering keys in other engines) determine the physical on-disk order of rows within each node's storage, letting the engine skip entire blocks of data that can't match a filter — this is often called 'zone map' or 'min/max' pruning, and it's why filtering on a well-chosen sort key can be dramatically faster than filtering on an unsorted column."
  ],
  keyPoints: [
    "Distribution key: controls which node each row lives on — bad choice = network shuffle on every join",
    "Sort key: controls on-disk row order within a node — enables block-skipping on filters",
    "Redshift: DISTKEY/SORTKEY; Synapse: hash/round-robin/replicated distribution + clustered columnstore index",
    "A co-located join (same distribution key on both sides) avoids data movement entirely"
  ],
  whyNow: "Fully managed warehouses (Snowflake, BigQuery) are pushing to auto-select these physical layout decisions for you via micro-partitioning and adaptive clustering — but Redshift and Synapse dedicated pools still put a meaningful chunk of this responsibility on the DBA, which is exactly the kind of tuning work reverse-KT handovers need to cover.",
  quiz: [
    { q: "Choosing a bad distribution key mainly risks:", opts: ["Slower disk compression", "Heavy network shuffling during joins", "Losing data on failover", "Breaking schema evolution"], correct: 1, explain: "If joined tables aren't distributed on the join key, the engine has to move rows across nodes over the network before it can join them." },
    { q: "A sort key primarily helps performance by:", opts: ["Compressing text columns", "Letting the engine skip blocks that can't match a filter", "Speeding up single-row inserts", "Reducing the number of nodes needed"], correct: 1, explain: "Sorted data lets the engine use min/max zone maps to skip whole blocks that fall outside a filter's range, avoiding unnecessary scans." }
  ]
},
{
  category: "governance.access",
  title: "row_column_security",
  tagline: "Locking down a warehouse below the table level, without maintaining a maze of views.",
  lesson: [
    "Table-level grants are often too blunt: an analyst may need to see order data but not customer PII, or see only their own region's rows. Row-level security (RLS) filters which rows a query returns based on the querying user/role; column-level security (or dynamic data masking) restricts or obfuscates specific columns for certain roles — both enforced by the engine itself, not by application code.",
    "This matters because the alternative — building and maintaining dozens of restricted views per role — doesn't scale and drifts out of sync with the base tables. Native RLS/masking policies are attached to the table once and apply automatically to every query, including ones written by tools the DBA never anticipated."
  ],
  keyPoints: [
    "RLS: filters which rows a role can see, enforced at query time",
    "Column masking: obscures/nulls specific columns for unauthorized roles",
    "Enforced by the engine, not application code — can't be bypassed by querying directly",
    "Available natively in Redshift, Synapse, Snowflake, BigQuery (each with different syntax)"
  ],
  whyNow: "With GDPR-style regulations spreading and more self-serve BI tools querying warehouses directly, engine-level RLS and masking have shifted from a 'nice to have' to the default way of enforcing PII access rather than trusting every downstream tool to filter correctly.",
  quiz: [

/* ---------------- Utility: today's pick ---------------- */
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}
const now = new Date();
const todayIdx = dayOfYear(now) % LIB.length;
const topic = LIB[todayIdx];

/* ---------------- Render static content ---------------- */
document.getElementById('dateLabel').textContent = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
document.getElementById('categoryLabel').textContent = topic.category;
document.getElementById('titleLabel').textContent = topic.title;
document.getElementById('taglineLabel').textContent = topic.tagline;

const lessonBody = document.getElementById('lessonBody');
topic.lesson.forEach(p => {
  const el = document.createElement('p');
  el.textContent = p;
  lessonBody.appendChild(el);
});

const keyPoints = document.getElementById('keyPoints');
topic.keyPoints.forEach((k, i) => {
  const li = document.createElement('li');
  const idx = document.createElement('span');
  idx.className = 'idx';
  idx.textContent = String(i + 1).padStart(2, '0');
  const txt = document.createElement('span');
  txt.textContent = k;
  li.appendChild(idx);
  li.appendChild(txt);
  keyPoints.appendChild(li);
});

document.getElementById('whyNow').textContent = topic.whyNow;

/* ---------------- Quiz ---------------- */
const quizArea = document.getElementById('quizArea');
const quizProgress = document.getElementById('quizProgress');
let answeredCount = 0;

function renderQuiz() {
  quizArea.innerHTML = '';
  topic.quiz.forEach((q, qi) => {
    const block = document.createElement('div');
    block.style.marginBottom = qi < topic.quiz.length - 1 ? '22px' : '0';

    const qEl = document.createElement('div');
    qEl.className = 'quiz-q';
    qEl.textContent = `${qi + 1}. ${q.q}`;
    block.appendChild(qEl);

    const explainEl = document.createElement('div');
    explainEl.className = 'quiz-explain';
    explainEl.textContent = q.explain;

    q.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        const buttons = block.querySelectorAll('.quiz-opt');
        buttons.forEach(b => b.disabled = true);
        if (oi === q.correct) {
          btn.dataset.state = 'correct';
        } else {
          btn.dataset.state = 'wrong';
          buttons[q.correct].dataset.state = 'correct';
        }
        explainEl.classList.add('show');
        answeredCount++;
        quizProgress.textContent = `${answeredCount} / ${topic.quiz.length} answered this session`;
      });
      block.appendChild(btn);
    });

    block.appendChild(explainEl);
    quizArea.appendChild(block);
  });
  quizProgress.textContent = `0 / ${topic.quiz.length} answered this session`;
}
renderQuiz();

/* ---------------- Theme toggle ---------------- */
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  if (current === 'dark') { root.setAttribute('data-theme', 'light'); }
  else if (current === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme', 'dark'); }
});

/* ---------------- AI live briefing (sample capability) ---------------- */
const aiBtn = document.getElementById('aiBtn');
const aiBody = document.getElementById('aiBody');
const aiPlaceholder = document.getElementById('aiPlaceholder');

async function initAI() {
  if (!window.claude || typeof window.claude.use !== 'function') {
    aiBtn.classList.add('ai-hidden');
    aiPlaceholder.textContent = "Live briefings aren't available in this view.";
    return;
  }
  const sample = await window.claude.use('sample');
  if (!sample) {
    aiBtn.classList.add('ai-hidden');
    aiPlaceholder.textContent = "Live briefings aren't available in this view.";
    return;
  }

  aiBtn.addEventListener('click', async () => {
    aiBtn.disabled = true;
    aiBtn.innerHTML = '<span class="spin"></span> asking';
    aiPlaceholder.classList.add('ai-hidden');
    aiBody.classList.remove('ai-hidden');
    aiBody.textContent = '';

    const prompt = `You are writing a short "what's new" briefing for a DevOps engineer who works daily with AWS Redshift and is learning Azure Synapse, and is studying the data warehousing/database concept "${topic.title}" (${topic.tagline}). In 120-180 words, give a current, concrete update on recent developments, notable releases, or shifts in how the industry approaches this specific concept in the last year or so. Be specific (name real tools/versions/companies where relevant), skip generic background they already have from the lesson, and don't use markdown headers.`;

    try {
      const result = await sample(prompt, {
        modelTier: 'default',
        onText: ({ text }) => { aiBody.textContent = text; }
      });
      aiBody.textContent = result.text;
    } catch (err) {
      aiBody.textContent = 'Could not reach the briefing right now — try again in a moment.';
    } finally {
      aiBtn.disabled = false;
      aiBtn.innerHTML = 'refresh ▸';
    }
  });
}
initAI();

/* ---------------- PWA: service worker (offline support) ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable, app still works online */ });
  });
}
